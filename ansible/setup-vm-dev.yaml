---
- name: Ensure required tooling is installed, validated and logged in
  hosts: all

  vars:
    git_repo_url: "https://github.com/ansible/ansible-examples.git"
    git_dest: "/home/{{ ansible_user }}/repo"

    podman_registry_url: "quay.io"
    podman_registry_username: ""
    podman_registry_password: ""

    oc_api_url: "https://api.example.com:6443"
    oc_token: ""
    oc_cli_download_url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/openshift-client-linux.tar.gz"

    # --- Pin versi exact (hasil cek: dnf list --installed git podman python3) ---
    git_version: "2.55.0-1.fc44"
    podman_version: "5:5.8.1-1.fc44"
    python3_version: "3.14.3-2.fc44"

  tasks:

    - name: Validasi semua input wajib sebelum automation dijalankan
      ansible.builtin.assert:
        that:
          - git_repo_url is defined and git_repo_url | length > 0
          - podman_registry_url is defined and podman_registry_url | length > 0
          - podman_registry_username is defined and podman_registry_username | length > 0
          - podman_registry_password is defined and podman_registry_password | length > 0
          - oc_api_url is defined and oc_api_url | length > 0
          - oc_token is defined and oc_token | length > 0
        fail_msg: "Input tidak valid! Pastikan semua Extra Variables sudah diisi dan tidak kosong."
        success_msg: "Semua input wajib terisi."
        quiet: true

    - name: Validasi format git_repo_url harus URL git yang valid
      ansible.builtin.assert:
        that:
          - git_repo_url is match("^(https?)://.+")
        fail_msg: "git_repo_url tidak valid. Harus berupa URL http/https (contoh: https://github.com/user/repo.git atau https://gitea-host/user/repo)"
        success_msg: "Format git_repo_url valid."

    - name: Validasi format podman_registry_url
      ansible.builtin.assert:
        that:
          - podman_registry_url is match("^[a-zA-Z0-9.-]+\\.[a-zA-Z]{2,}$") or podman_registry_url is match("^https?://.+")
        fail_msg: "podman_registry_url tidak valid. Harus berupa domain registry (contoh: quay.io) atau URL lengkap."
        success_msg: "Format podman_registry_url valid."

    - name: Validasi format oc_api_url harus HTTPS dan punya port
      ansible.builtin.assert:
        that:
          - oc_api_url is match("^https://.+:[0-9]+$")
        fail_msg: "oc_api_url tidak valid. Harus berupa https://<host>:<port> (contoh: https://api.example.com:6443)"
        success_msg: "Format oc_api_url valid."

    - name: Validasi panjang minimum podman_registry_username
      ansible.builtin.assert:
        that:
          - podman_registry_username | length >= 3
        fail_msg: "podman_registry_username terlalu pendek, minimal 3 karakter."
        success_msg: "podman_registry_username valid."

    - name: Validasi panjang minimum podman_registry_password (tanpa expose value)
      ansible.builtin.assert:
        that:
          - podman_registry_password | length >= 8
        fail_msg: "podman_registry_password terlalu pendek, minimal 8 karakter."
        success_msg: "podman_registry_password memenuhi panjang minimum."
        quiet: true

    - name: Validasi panjang minimum oc_token (sanity check, tanpa expose value)
      ansible.builtin.assert:
        that:
          - oc_token | length >= 20
        fail_msg: "oc_token terlihat tidak valid (terlalu pendek)."
        success_msg: "oc_token memenuhi panjang minimum."
        quiet: true

    - name: Validasi git_dest adalah path absolut
      ansible.builtin.assert:
        that:
          - git_dest is match("^/.+")
        fail_msg: "git_dest harus berupa path absolut (diawali dengan /)."
        success_msg: "git_dest valid."

    # --- Install (exact version, bukan latest) ---
    - name: Install git with exact version
      ansible.builtin.dnf:
        name: "git-{{ git_version }}"
        state: present
        allow_downgrade: true
      become: true

    - name: Install podman with exact version
      ansible.builtin.dnf:
        name: "podman-{{ podman_version }}"
        state: present
        allow_downgrade: true
      become: true

    - name: Install python3 with exact version
      ansible.builtin.dnf:
        name: "python3-{{ python3_version }}"
        state: present
        allow_downgrade: true
      become: true

    - name: Download oc CLI
      ansible.builtin.get_url:
        url: "{{ oc_cli_download_url }}"
        dest: "/tmp/openshift-client-linux.tar.gz"
        mode: "0644"

    - name: Extract oc to /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/openshift-client-linux.tar.gz"
        dest: "/usr/local/bin"
        remote_src: true
        mode: "0755"
      become: true

    # --- Validate ---
    - name: Check versions of all tools
      ansible.builtin.command: "{{ item }}"
      loop:
        - git --version
        - podman --version
        - python3 --version
        - oc version --client
      register: tool_versions
      changed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        msg: "{{ tool_versions.results | map(attribute='stdout') | list }}"

    - name: Assert installed versions match the pinned exact versions
      ansible.builtin.assert:
        that:
          - "git_version.split('-')[0] in tool_versions.results[0].stdout"
          - "podman_version.split(':')[-1].split('-')[0] in tool_versions.results[1].stdout"
          - "python3_version.split('-')[0] in tool_versions.results[2].stdout"
        fail_msg: "Versi tools yang terinstall tidak sesuai dengan versi yang sudah dipin di vars."
        success_msg: "Semua versi tools sesuai dengan yang dipin."

    # --- git clone ---
    - name: Clone the git repository
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_dest }}"

    # --- podman login ---
    - name: Log in to the container registry with podman
      ansible.builtin.command: "podman login {{ podman_registry_url }} -u {{ podman_registry_username }} -p {{ podman_registry_password }}"
      when: podman_registry_username | length > 0 and podman_registry_password | length > 0
      no_log: true

    # --- oc login ---
    - name: Log in to the OpenShift cluster with oc
      ansible.builtin.command: "oc login {{ oc_api_url }} --token={{ oc_token }}"
      when: oc_token | length > 0
      no_log: true

    - name: Confirm oc login
      ansible.builtin.command: oc whoami
      register: oc_whoami
      changed_when: false
      when: oc_token | length > 0

    - name: Show oc login identity
      ansible.builtin.debug:
        msg: "Logged in as {{ oc_whoami.stdout }}"
      when: oc_token | length > 0